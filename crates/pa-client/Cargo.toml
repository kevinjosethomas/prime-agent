[package]
name = "pa-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared daemon transport for Prime Agent frontends: the JSONL supervisor client plus the capability-gated direct worker link."

[dependencies]
pa-types = { path = "../pa-types" }
anyhow = "1"
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util", "net"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
