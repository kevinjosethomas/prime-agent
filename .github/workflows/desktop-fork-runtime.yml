name: Desktop fork runtime
on:
  push:
    branches: [feat/root-desktop-runtime, primer/runtime-followups-candidate]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-fork-runtime-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/dependency-audit
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          components: rustfmt
      - name: Format and prepare a reviewable patch
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/rustfmt.patch"
          git diff --exit-code
      - name: Upload formatting patch
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rustfmt-patch
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: error
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # This repository does not stage the separately owned desktop reporter.
      # Full discovery includes the exact readiness probe; canonical SQLite tests
      # skip without WORKSTREAM_DESKTOP_REPORTER. See docs/desktop-runtime-verification.md.
      - name: Verify complete Python source and readiness suite (not desktop interop)
        run: PYTHONPATH=prime-agent-runtime/src python -m unittest discover -s prime-agent-runtime/tests -v
      - name: Verify session and subagent runtime regressions
        working-directory: prime-agent-runtime
        run: |
          PYTHONPATH=src python -m unittest discover -s test -p test_create_session.py -v
          PYTHONPATH=src python -m unittest discover -s test -p test_subagent_registry.py -v
      - name: State canonical reporter coverage boundary
        run: |
          echo 'Python source/readiness coverage is not canonical desktop archive verification. The 3 reporter tests skip here because this repository does not stage the desktop reporter. Require an exact-candidate, exact-desktop-artifact full discovery run with zero skips before installation; see docs/desktop-runtime-verification.md.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build and inspect Python wheel
        run: |
          python -m pip install build
          python -m build --wheel prime-agent-runtime
          python - <<'PYW'
          import glob, zipfile
          with zipfile.ZipFile(glob.glob('prime-agent-runtime/dist/*.whl')[0]) as wheel:
              assert 'workstreams/__init__.py' in wheel.namelist()
          PYW
  macos:
    needs: [audit, format, python]
    runs-on: macos-14
    timeout-minutes: 90
    env:
      TARGET: aarch64-apple-darwin
      COPYFILE_DISABLE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The pinned SHA is the toolchain pin: this action version has no
      # `toolchain` input, and its parse step hard-codes 1.98.1. Change the
      # compiler by changing the SHA; a `toolchain:` input is ignored.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ env.TARGET }}
      # Only the shipped binary links here: the job packages `prime-agent`
      # alone, so pa-daemon's [[bin]] would be a second thin-LTO link with
      # no consumer (~26% of the build step, measured).
      - name: Build (release, locked)
        run: cargo build --release --locked --target ${{ env.TARGET }} -j 4 -p pa-cli --bin prime-agent
      - name: Verify native desktop auth broker and reused login flows
        run: |
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-cli --lib auth_json
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-cli --lib provider_login
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-cli --lib mcp_login
          python3 - <<'PYAUTH'
          import json, subprocess
          result = subprocess.run(['target/aarch64-apple-darwin/release/prime-agent', 'auth', '--json'], input='', text=True, capture_output=True, timeout=10, check=True)
          rows = [json.loads(line) for line in result.stdout.splitlines()]
          assert len(rows) == 1 and rows[0]['type'] == 'ready' and rows[0]['protocolVersion'] == 1
          assert 'provider_auth_methods' in rows[0]['capabilities']
          PYAUTH
      - name: Verify semantic thread evaluator and compiled CLI probe
        run: |
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-ai --lib thread_classification
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-cli --lib thread_classify
          python3 - <<'PYTHREAD'
          import json, subprocess
          result = subprocess.run(['target/aarch64-apple-darwin/release/prime-agent', 'thread-classify', '--json'], input='', text=True, capture_output=True, timeout=10, check=True)
          rows = [json.loads(line) for line in result.stdout.splitlines()]
          assert rows == [{'type': 'ready', 'protocolVersion': 1}]
          for flags in [['--json', '--contrastive'], ['--contrastive']]:
              probe = subprocess.run(['target/aarch64-apple-darwin/release/prime-agent', 'thread-classify', *flags], input='', text=True, capture_output=True, timeout=10, check=True)
              assert [json.loads(line) for line in probe.stdout.splitlines()] == [{'type': 'ready', 'protocolVersion': 1}]
          PYTHREAD
      - name: Run focused workstream classifier tests
        run: |
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-ai --lib systemone
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-daemon --lib workstream_classification
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-daemon --lib workstream_classifier_round_trips
      - name: Verify workstream runtime identity and readiness
        run: |
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-core --lib workstreams
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-core --lib kernel::bootstrap::venv
      - name: Verify Slack MCP login, callback, and catalog regressions
        run: |
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-core --lib mcp::
          cargo test --locked --target ${{ env.TARGET }} -j 4 -p pa-daemon --test mcp_catalog_e2e
      - name: Generate bundled catalog assets (fixture, offline-safe)
        run: |
          set -euo pipefail
          python3 scripts/release/bundle_catalog.py generate --fixture \
            --out "target/${{ env.TARGET }}/catalog-assets"
      - name: Assemble tarball + checksums + manifest (commit-stamped)
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          python3 scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${version}" \
            --target "${{ env.TARGET }}" \
            --sha "${GITHUB_SHA}" \
            --binary "target/${{ env.TARGET }}/release/prime-agent" \
            --catalog-assets "target/${{ env.TARGET }}/catalog-assets" \
            --out-dir "target/${{ env.TARGET }}/dist"
          cat "target/${{ env.TARGET }}/dist/manifest.json"
      # The livecheck extracts the tarball and runs the payload binary's
      # `--version` from a scratch cwd (verify_release.py). The aarch64 leg
      # executes it natively; the x86_64 leg, cross-compiled on the
      # Apple-silicon pool, executes it under Rosetta 2 — the runtime the
      # x64 payload runs on for an Apple-Silicon Mac customer, so the gate
      # still boots the artifact on its delivery runtime.
      - name: Livecheck the assembled continuous artifact on its build runner
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          python3 scripts/release/verify_release.py \
            --dist-dir "target/${{ env.TARGET }}/dist" \
            --version "${version}" \
            --target "${{ env.TARGET }}" \
            --sha "${GITHUB_SHA}"
      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-${{ env.TARGET }}
          path: |
            target/${{ env.TARGET }}/dist/prime-agent-*
            target/${{ env.TARGET }}/dist/SHA256SUMS
            target/${{ env.TARGET }}/dist/manifest.json
          if-no-files-found: error
