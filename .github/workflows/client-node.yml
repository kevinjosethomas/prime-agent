name: Client node adapter

# The native Node adapter's own gate: builds the darwin-arm64 addon, runs
# the full Node 22 battery against the real addon, and proves the Electron
# 44 main-process LOAD (app.quit lifecycle; not an exit proof). Push
# triggers on this branch work where workflow_dispatch cannot (the file
# is absent from the default branch until merge).
on:
  push:
    branches: [primer/client-node, primer/client-node-managed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-node-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Pinned external runtimes: exact version + sha256 from the release's
  # own official SHASUMS256.txt (validated by exact filename:
  # electron-v44.9.1-darwin-arm64.zip / node-v22.11.0-darwin-arm64.tar.gz),
  # verified before use — fail-closed on any mismatch.
  NODE_VERSION: "22.11.0"
  NODE_SHA256_ARM64: "2e89afe6f4e3aa6c7e21c560d8a0453d84807e97850bbb819b998531a22bdfde"
  ELECTRON_VERSION: "44.9.1"
  ELECTRON_SHA256_ARM64: "ff597552c9c7b0b16c39a7fb93a346ee7148afbd372ebcf0c18415482c49fbea"
  ELECTRON_SHA256_X64: "994bc3664cc3ac55b50c21a58d345cf8322003d37f5439a81801e3267e6145e2"
  NODE_SHA256_X64: "83bf07dd343002a26211cf1fcd46a9d9534219aad42ee02847816940bf610a72"

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The pinned SHA is the toolchain pin: this action version hard-codes
      # 1.98.1. Change the compiler by changing the SHA.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: ${{ env.TARGET }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: client-node-${{ env.TARGET }}
      - name: Install pinned Node 22
        run: |
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v22.11.0-linux-x64.tar.xz" -o /tmp/node.tar.xz
          echo "${NODE_SHA256_X64}  /tmp/node.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version && npm --version
      - name: Format check (strict)
        run: cargo fmt --all --check
        working-directory: crates/pa-client-node
      - name: Strict clippy (locked, all targets, deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: crates/pa-client-node
      - name: Build the addon (release, locked)
        run: cargo build --release --locked -p pa-client-node
        working-directory: crates/pa-client-node
      - name: "Build the contract package (the client's file: dependency)"
        run: |
          npm ci --no-audit --no-fund
          npm run build:validators
        working-directory: packages/client-contract
      - name: Stage the addon and provenance
        run: |
          cp ../../crates/pa-client-node/target/release/libpa_client_node.so native/linux-x64.node
          npm ci --no-audit --no-fund
          npm run gen:provenance
          npm run verify:provenance
          cat provenance.json
        working-directory: packages/client
      - name: TypeScript build
        run: npm run build
        working-directory: packages/client
      - name: Node 22 battery against the real addon
        # Per-test cap: a hung test fails in minutes with real output
        # instead of burning the 60-minute job timeout silently.
        run: node --test --test-timeout=120000 tests/*.test.mjs
        working-directory: packages/client
      - name: Electron 44 main-process proof
        run: |
          curl -fsSL "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v44.9.1-linux-x64.zip" -o /tmp/electron.zip
          echo "${ELECTRON_SHA256_X64}  /tmp/electron.zip" | sha256sum -c -
          rm -rf /tmp/electron-dist && unzip -q /tmp/electron.zip -d /tmp/electron-dist
          xvfb-run -a /tmp/electron-dist/electron --no-sandbox --disable-gpu --js-flags=--expose-gc e2e/electron-main.cjs
        working-directory: packages/client
      - name: "Stage the built JS dist (npm pack omits the gitignored dist/; the desktop's file: dependency needs it as a release asset)"
        run: tar -czf client-dist.tgz dist
        working-directory: packages/client
      - name: Upload the addon artifact with provenance
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pa-client-node-${{ github.sha }}-x86_64-unknown-linux-gnu
          path: |
            packages/client/native/linux-x64.node
            packages/client/provenance.json
            packages/client/client-dist.tgz
          if-no-files-found: error

  darwin-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The pinned SHA is the toolchain pin: this action version hard-codes
      # 1.98.1. Change the compiler by changing the SHA.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: ${{ env.TARGET }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: client-node-${{ env.TARGET }}
      - name: Install pinned Node 22
        run: |
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz" -o /tmp/node.tar.gz
          echo "${NODE_SHA256_ARM64}  /tmp/node.tar.gz" | shasum -a 256 -c -
          sudo tar -xzf /tmp/node.tar.gz -C /usr/local --strip-components=1
          node --version && npm --version
      - name: Format check (strict)
        run: cargo fmt --all --check
        working-directory: crates/pa-client-node
      - name: Strict clippy (locked, all targets, deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: crates/pa-client-node
      - name: Build the addon (release, locked)
        run: cargo build --release --locked -p pa-client-node
        working-directory: crates/pa-client-node
      - name: "Build the contract package (the client's file: dependency)"
        run: |
          npm ci --no-audit --no-fund
          npm run build:validators
        working-directory: packages/client-contract
      - name: Stage the addon and provenance
        run: |
          cp ../../crates/pa-client-node/target/release/libpa_client_node.dylib native/darwin-arm64.node
          npm ci --no-audit --no-fund
          npm run gen:provenance
          npm run verify:provenance
          cat provenance.json
        working-directory: packages/client
      - name: TypeScript build
        run: npm run build
        working-directory: packages/client
      - name: Node 22 battery against the real addon
        # Per-test cap: a hung test fails in minutes with real output
        # instead of burning the 60-minute job timeout silently.
        run: node --test --test-timeout=120000 tests/*.test.mjs
        working-directory: packages/client
      - name: Electron 44 main-process load proof
        run: |
          curl -fsSL "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip" -o /tmp/electron.zip
          echo "${ELECTRON_SHA256_ARM64}  /tmp/electron.zip" | shasum -a 256 -c -
          unzip -q /tmp/electron.zip -d /tmp/electron-dist
          /tmp/electron-dist/Electron.app/Contents/MacOS/Electron --js-flags=--expose-gc e2e/electron-main.cjs
        working-directory: packages/client
      - name: Upload the addon artifact with provenance
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pa-client-node-${{ github.sha }}-aarch64-apple-darwin
          path: |
            packages/client/native/darwin-arm64.node
            packages/client/provenance.json
          if-no-files-found: error
