name: Recovery failover baseline comparison
on:
  push:
    branches: [diagnostic/recovery-failover]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        source:
          - 6b7e0913a6ae06507b1224ff4c4f559cf0f44fff
          - 2991a781c4957daa2fa039f8158c9b2ffad0f439
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      PA_FAILOVER_E2E_DEBUG: '1'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2991a781c4957daa2fa039f8158c9b2ffad0f439
          persist-credentials: false
      - name: Retain the exact deterministic regression fixture
        run: cp crates/pa-daemon/src/supervisor/clients/read_tests.rs "$RUNNER_TEMP/fragmented-client-read-tests.rs"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: test-shards
      - name: Match full-suite binary and ready-kernel prerequisites
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          cargo build --locked --workspace --bins
          ./target/debug/prime-agent --prime-agent-bootstrap
          test -x "$HOME/.prime/agent/kernel-venv/bin/python"
      - name: Add timeout evidence without changing behavior or bounds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/pa-daemon/tests/provider_failover_e2e.rs')
          source = p.read_text()
          needle = '"timed out waiting for supervisor line: {error}"'
          assert source.count(needle) == 1
          source = source.replace(needle, '"timed out waiting for supervisor line: {error}; observed event types: {:?}", self.events.iter().map(|event| event.get("type")).collect::<Vec<_>>()')
          needle = '            self.collect_event(&line);'
          assert source.count(needle) == 1
          source = source.replace(needle, '''            if line.get("type").and_then(Value::as_str) == Some("response") {
                          eprintln!("unmatched response while waiting for {id}: {line}");
                      }
          ''' + needle)
          p.write_text(source)
          PY
      - name: Prove old readers fail and fixed reader passes the same fragmented frame
        env:
          SOURCE_SHA: ${{ matrix.source }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/failover-evidence"
          mkdir -p crates/pa-daemon/src/supervisor/clients
          cp "$RUNNER_TEMP/fragmented-client-read-tests.rs" crates/pa-daemon/src/supervisor/clients/read_tests.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/pa-daemon/src/supervisor/clients.rs')
          source = p.read_text()
          if 'mod read_tests;' not in source:
              p.write_text(source + '\n#[cfg(all(test, unix))]\nmod read_tests;\n')
          PY
          set +e
          cargo test --locked -p pa-daemon --lib fragmented_client_frame -- --nocapture 2>&1 | tee "$RUNNER_TEMP/failover-evidence/fragmented-frame.log"
          status="${PIPESTATUS[0]}"
          set -e
          python3 - "$status" <<'PY'
          import os, sys
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP'])/'failover-evidence/fragmented-frame.log').read_text()
          status = int(sys.argv[1])
          fixed = os.environ['SOURCE_SHA'] == '2991a781c4957daa2fa039f8158c9b2ffad0f439'
          if fixed:
              assert status == 0 and 'test result: ok. 1 passed; 0 failed' in log, log[-4000:]
          else:
              assert status != 0 and 'test result: FAILED. 0 passed; 1 failed' in log, log[-4000:]
              assert 'fragmented_client_frame_survives_interleaved_broadcast' in log, log[-4000:]
          PY
      - name: Run fixed parallel and serial samples with ready kernel
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/failover-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/failover-evidence/source.txt"
          git diff --binary > "$RUNNER_TEMP/failover-evidence/diagnostic-only.patch"
          cp crates/pa-daemon/src/supervisor/clients/read_tests.rs "$RUNNER_TEMP/failover-evidence/fragmented-client-read-tests.rs"
          # Fixed sample count, every result retained; a later pass cannot hide a failure.
          result=0
          for sample in 1 2 3; do
            cargo test --locked -p pa-daemon --test provider_failover_e2e -- --nocapture 2>&1 | tee "$RUNNER_TEMP/failover-evidence/parallel-${sample}.log" || result=1
            cargo test --locked -p pa-daemon --test provider_failover_e2e -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/failover-evidence/serial-${sample}.log" || result=1
          done
          ps -eo pid,ppid,state,etime,comm > "$RUNNER_TEMP/failover-evidence/processes.txt"
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: failover-${{ matrix.source }}
          path: ${{ runner.temp }}/failover-evidence
          if-no-files-found: error
