name: Recovery failover baseline comparison
on:
  push:
    branches: [diagnostic/recovery-failover]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        source:
          - 204cfaa71e1d9eb409239f599a102cf0ec7dd65c
          - 6b7e0913a6ae06507b1224ff4c4f559cf0f44fff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      PA_FAILOVER_E2E_DEBUG: '1'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: test-shards
      - name: Run unchanged threshold failover scenario once
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/failover-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/failover-evidence/source.txt"
          cargo test --locked -p pa-daemon --test provider_failover_e2e threshold_yield_keeps_the_backup_until_the_tool_run_finishes -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/failover-evidence/test.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: failover-${{ matrix.source }}
          path: ${{ runner.temp }}/failover-evidence
          if-no-files-found: error
