[project]
name = "prime-agent-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Prime Agent recursion"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "tyro",
  "httpx>=0.27,<1",
  "pillow>=10.0.0",
]

[dependency-groups]
dev = ["dill"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm", "src/tasks"]
